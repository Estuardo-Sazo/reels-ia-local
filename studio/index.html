<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/reel.css" />
    <style>
      html, body { width: 1080px; height: 1920px; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- Reel vertical 9:16. El mismo episodio en 16:9 está en compositions/youtube.html -->
    <div id="root" data-composition-id="reel" data-start="0" data-duration="43.5" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="grain"></div>
      <div id="medios" style="position:absolute;inset:0"><!-- medios -->
        <!-- /medios --></div>
      <div id="stage"><!-- medios-escenario -->
        <!-- /medios-escenario --></div>
      <div id="vignette"></div>
      <div id="tag"></div>
      <div id="captions"></div>
      <audio id="voz" src="assets/ep006/voz.wav" data-start="0" data-duration="41.964" data-volume="1"></audio>
    </div>
    <script src="assets/ep006/data.js"></script>
    <script src="assets/ep006/scenes.js"></script>
    <script src="assets/reel.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["reel"] = tl;
      window.buildReel(tl);
    </script>
  </body>
</html>
